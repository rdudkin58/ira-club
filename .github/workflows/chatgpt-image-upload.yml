name: ChatGPT image upload

on:
  push:
    paths:
      - ".chatgpt/image-queue/**"

permissions:
  contents: write

concurrency:
  group: chatgpt-image-upload
  cancel-in-progress: false

jobs:
  install-images:
    if: ${{ !contains(github.event.head_commit.message, '[image-upload-skip]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode completed image tasks
        shell: bash
        run: |
          python3 <<'PY'
          import base64
          import json
          from pathlib import Path

          queue = Path(".chatgpt/image-queue")

          if not queue.exists():
              print("No queue.")
              raise SystemExit(0)

          allowed_extensions = {".jpg", ".jpeg", ".png", ".webp"}
          allowed_roots = {"images", "assets"}

          processed = []

          for manifest in sorted(queue.glob("*/manifest.json")):
              task_dir = manifest.parent
              task = json.loads(manifest.read_text(encoding="utf-8"))

              target = task.get("path", "").strip()
              parts_count = int(task.get("parts", 0))

              if not target or parts_count < 1:
                  print(f"Skipping invalid task: {manifest}")
                  continue

              target_path = Path(target)

              if target_path.is_absolute() or ".." in target_path.parts:
                  raise ValueError(f"Unsafe path: {target}")

              if target_path.suffix.lower() not in allowed_extensions:
                  raise ValueError(f"Unsupported image type: {target_path.suffix}")

              if (
                  not target_path.parts
                  or target_path.parts[0] not in allowed_roots
              ):
                  raise ValueError(
                      f"Target must be under images/ or assets/: {target}"
                  )

              part_files = [
                  task_dir / f"part-{n:03d}.txt"
                  for n in range(1, parts_count + 1)
              ]

              if not all(p.exists() for p in part_files):
                  print(f"Task incomplete, waiting: {task_dir}")
                  continue

              payload = "".join(
                  p.read_text(encoding="utf-8").strip()
                  for p in part_files
              )

              image_bytes = base64.b64decode(payload, validate=True)

              if not image_bytes:
                  raise ValueError(f"Empty image: {target}")

              if len(image_bytes) > 15 * 1024 * 1024:
                  raise ValueError(f"Image too large: {target}")

              target_path.parent.mkdir(parents=True, exist_ok=True)
              target_path.write_bytes(image_bytes)

              print(f"Created {target_path}: {len(image_bytes)} bytes")

              processed.append(task_dir)

          for task_dir in processed:
              for p in task_dir.iterdir():
                  p.unlink()
              task_dir.rmdir()

          print(f"Completed {len(processed)} task(s).")
          PY

      - name: Commit generated images
        shell: bash
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add -A

            git commit \
              -m "Add generated site images [image-upload-skip]"

            git push
          else
            echo "Nothing to commit."
          fi
