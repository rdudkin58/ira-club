name: Publish Instagram story ZIP

on:
  push:
    branches: [main]
    paths:
      - "uploads/stories/*.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: irina-stories-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Extract and validate all 16 PNG files
        run: python3 scripts/extract_story_upload.py
      - name: Commit extracted images to the site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add irina-story-{01..16}.png
          if git diff --cached --quiet; then
            echo "All story images already up to date"
            exit 0
          fi
          git commit -m "Publish 16 Instagram story images [skip ci]"
          git push origin HEAD:main
