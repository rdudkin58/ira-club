<title>Колесо бренда — правки Клода</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --ivory:#FBF7F0; --paper:#FFFDF8; --ink:#2E2620; --muted:#6F6257; --gold:#B08D57; --line:#E7DCCB;
        --mark:#FFE97A; --markink:#2E2620; --del:#9A8F86; --iri:#7A4E1F; --iribg:#F6E4C8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ivory:#1C1814; --paper:#24201B; --ink:#EFE7DC; --muted:#B7AA9B; --gold:#D2AE73; --line:#3A332B;
  --mark:#6B5A00; --markink:#FFF6C2; --del:#8A8077; --iri:#F3D6A8; --iribg:#4A3820; } }
:root[data-theme="dark"] { --ivory:#1C1814; --paper:#24201B; --ink:#EFE7DC; --muted:#B7AA9B; --gold:#D2AE73; --line:#3A332B;
  --mark:#6B5A00; --markink:#FFF6C2; --del:#8A8077; --iri:#F3D6A8; --iribg:#4A3820; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--ivory); color:var(--ink); }
body { font:16px/1.6 Manrope, system-ui, sans-serif; padding:24px 16px 64px; overflow-wrap:anywhere; }
main { max-width:860px; margin:0 auto; }
h1, h2, h3 { font-family:"Cormorant Garamond", Georgia, serif; line-height:1.2; color:var(--ink); }
h1 { font-size:34px; margin:4px 0 8px; }
h2 { font-size:27px; margin:36px 0 12px; padding-top:12px; border-top:1px solid var(--line); }
h3 { font-size:21px; margin:24px 0 8px; }
.kicker { color:var(--gold); text-transform:uppercase; letter-spacing:.08em; font-size:13px; font-weight:700; margin:0; }
.lead { color:var(--muted); }
.intro { background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:20px 18px; margin-bottom:28px; }
.intro h2 { border-top:none; padding-top:0; margin-top:24px; font-size:24px; }
.intro li { margin-bottom:8px; }
.legend { display:flex; flex-wrap:wrap; gap:8px 18px; font-size:14px; }
mark { background:var(--mark); color:var(--markink); padding:0 2px; border-radius:3px; }
del { color:var(--del); text-decoration-thickness:1.5px; }
.del-block, .del-block * { color:var(--del) !important; text-decoration:line-through; text-decoration-thickness:1.5px; }
.add { background:var(--mark); color:var(--markink); border-radius:10px; padding:2px 16px; margin:14px 0; }
.add * { color:var(--markink); }
.add mark { background:transparent; }
.iri { display:inline-block; background:var(--iribg); color:var(--iri); font-size:12px; font-weight:700;
        border-radius:999px; padding:1px 8px; vertical-align:1px; text-decoration:none; }
blockquote { margin:16px 0; padding:10px 16px; border-left:3px solid var(--gold); background:var(--paper); border-radius:0 10px 10px 0; }
.tw { overflow-x:auto; margin:12px 0; border:1px solid var(--line); border-radius:10px; }
.tw table { min-width:560px; }
table { border-collapse:collapse; width:100%; font-size:14.5px; background:var(--paper); }
th, td { overflow-wrap:normal; word-break:normal; hyphens:auto; padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
th { font-weight:700; }
code { font-size:13px; }
hr { border:none; }

:root { --surface:var(--paper); --bg:var(--ivory); --focus:var(--gold); --cta:#A8442F; }
.wrap { max-width:860px; margin:0 auto; }
.eyebrow { color:var(--gold); text-transform:uppercase; letter-spacing:.08em; font-size:13px; font-weight:700; }

.lock-form{margin-top:24px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:grid;grid-template-columns:minmax(0,1fr);gap:10px;max-width:420px}
.lock-label{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.lock-row{display:flex;gap:8px}
.lock-row input{flex:1;min-width:0;width:100%;font:500 18px/1.2 "Manrope",system-ui,sans-serif;letter-spacing:.2em;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.lock-row input:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.lock-row button{flex:0 0 auto;border:0;border-radius:10px;background:var(--gold);color:var(--bg);font:600 15px/1 "Manrope",system-ui,sans-serif;padding:0 18px;cursor:pointer}
.lock-row button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.lock-row button:disabled{opacity:.7;cursor:progress}
.lock-err{margin:0;font-size:14px;color:var(--cta)}
.lock-wait .lock-form{visibility:hidden}
</style>
</head>
<body>
<div class="wrap" id="lock">
  <div class="top">
    <div class="eyebrow">Рекомендации для Ирины</div>
    <h1>Закрытая страница</h1>
    <p class="lead">Здесь «Колесо бренда» с правками Клода. Введи пароль, чтобы открыть.</p>
  </div>
  <form class="lock-form" id="lock-form">
    <label class="lock-label" for="lock-pass">Пароль</label>
    <div class="lock-row">
      <input id="lock-pass" type="password" inputmode="numeric" autocomplete="current-password" required>
      <button type="submit" id="lock-btn">Открыть</button>
    </div>
    <p class="lock-err" id="lock-err" role="alert" hidden>Пароль не подошёл. Попробуй ещё раз.</p>
  </form>
  <noscript><p class="lead">Чтобы открыть страницу, включи JavaScript в браузере.</p></noscript>
</div>

  if(p0){
    document.documentElement.classList.add('lock-wait');
    unlock(p0).then(show,function(){save('');document.documentElement.classList.remove('lock-wait');});
  }
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var v=input.value.trim();if(!v)return;
    btn.disabled=true;btn.textContent='Открываю…';err.hidden=true;
    unlock(v).then(function(page){save(v);show(page);},function(){
      btn.disabled=false;btn.textContent='Открыть';err.hidden=false;input.select();
    });
  });
})();
</script>
</body>
</html>
