<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="16x16" href="../favicon-balance-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-balance-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="../favicon-balance-48.png">
<link rel="icon" type="image/png" sizes="96x96" href="../favicon-balance-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="../favicon-balance-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="../favicon-balance-512.png">
<link rel="apple-touch-icon" href="../apple-touch-icon-balance.png">
<title>Неделя про силы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FAF6EE;
  --surface:#FFFDF8;
  --ink:#2B2620;
  --muted:#7A6F60;
  --line:#E7DDCB;
  --gold:#A8823A;
  --gold-soft:#F3E9D3;
  --todo-bg:#FBF3E1;
  --todo-line:#E4CF9F;
  --cta:#8A5A2B;
  --cta-bg:#F4E4D2;
  --focus:#A8823A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1C1915;--surface:#25211B;--ink:#EFE7D8;--muted:#A99C87;--line:#3A342A;
    --gold:#D4B06A;--gold-soft:#3A3122;--todo-bg:#2E2718;--todo-line:#5A4A2A;
    --cta:#E7B98A;--cta-bg:#3D2E20;--focus:#D4B06A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1C1915;--surface:#25211B;--ink:#EFE7D8;--muted:#A99C87;--line:#3A342A;
  --gold:#D4B06A;--gold-soft:#3A3122;--todo-bg:#2E2718;--todo-line:#5A4A2A;
  --cta:#E7B98A;--cta-bg:#3D2E20;--focus:#D4B06A;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:680px;margin:0 auto}
.top{padding-block:32px 8px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
.range{color:var(--muted);font-size:14px;margin-top:4px;font-variant-numeric:tabular-nums}
h1{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:600;font-size:clamp(34px,8vw,46px);line-height:1.05;margin:.3em 0 .25em;text-wrap:balance}
.lead{color:var(--muted);margin:0;max-width:60ch}
.rules{margin:20px 0 0;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:grid;gap:6px;font-size:14.5px}
.rules b{font-weight:600}
nav.days{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.days::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;min-width:52px;padding:6px 8px;border-radius:10px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface)}
.chip span{font-weight:700;font-size:14px}
.chip small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip:focus-visible,.copy:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.day{padding-block:28px 8px;border-bottom:1px solid var(--line);scroll-margin-top:80px;display:grid;gap:14px}
.day-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 12px}
.when{display:flex;align-items:baseline;gap:10px}
.dname{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;font-weight:600;line-height:1}
.date{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--gold-soft);color:var(--ink)}
.tag.cta{background:var(--cta-bg);color:var(--cta);font-weight:600}
.todo{background:var(--todo-bg);border:1px solid var(--todo-line);border-radius:12px;padding:12px 14px;font-size:14.5px}
.todo-h{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold);margin-bottom:4px}
.todo ul{margin:0;padding-left:18px;display:grid;gap:4px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.post-text{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px 16px 12px;font-size:15.5px}
.post-text a{color:var(--gold)}
.copy{display:block;width:100%;border:0;border-top:1px solid var(--line);background:var(--gold-soft);color:var(--ink);font:600 15px/1 "Manrope",system-ui,sans-serif;padding:14px;cursor:pointer}
.copy:hover{filter:brightness(.97)}
.copy.done{background:var(--gold);color:var(--bg)}
.voice{border:1px dashed var(--todo-line);border-radius:14px;background:var(--todo-bg);overflow:hidden}
.voice-h{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold);padding:14px 16px 0}
.voice-note{margin:4px 16px 0;font-size:14px;color:var(--muted)}
.voice-text{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px 16px 14px;font-size:15.5px}
.pause{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.img{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px}
.img summary{cursor:pointer;padding:12px 0;font-weight:600;font-size:14.5px;color:var(--gold)}
.img-note{margin:0 0 10px;font-size:14px}
.img-row{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.lang{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);padding-top:3px}
.img-text{font-size:14px;overflow-wrap:anywhere}
.copy.small{grid-column:2;width:auto;justify-self:start;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
.img-hint{margin:0;padding:8px 0 12px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line)}
.foot{color:var(--muted);font-size:13px;padding-top:20px}
.krug{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px 16px;display:grid;gap:12px}
.krug-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.krug-title{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.krug-note{font-size:12.5px;color:var(--muted)}
.k-list{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.k{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.ring{width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.k-body{display:grid;gap:3px;min-width:0}
.k-when{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.k-t{font-weight:600;font-size:15px}
.k-say{margin:0;font-size:15px;overflow-wrap:anywhere}
.k-hint{margin:0;font-size:13.5px;color:var(--muted)}
.guide{padding-block:32px 12px;border-bottom:1px solid var(--line);display:grid;gap:14px;scroll-margin-top:80px}
.guide h2{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-size:30px;font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
.guide>p{margin:0;max-width:60ch}
.rows{margin:0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.row{display:grid;grid-template-columns:minmax(96px,30%) 1fr;gap:4px 14px;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row dt{font-weight:600;font-size:14.5px}
.row dd{margin:0;font-size:15px}
.more{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px}
.more summary{cursor:pointer;padding:12px 0;font-weight:600;font-size:14.5px;color:var(--gold)}
.more summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.more-body{padding:0 0 14px;display:grid;gap:8px;font-size:15px}
.more-body h3{margin:8px 0 0;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.more-body p{margin:0}
.more-body ul{margin:0;padding-left:18px;display:grid;gap:4px}
@media (max-width:420px){.row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

.num{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--todo-line);color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.why{margin:0;font-size:15px;color:var(--ink);max-width:62ch}
.rub{margin:16px 0 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.rub .row{grid-template-columns:44px minmax(110px,32%) 1fr}
.rub .d{font-weight:700;font-size:14.5px}
.rub .h{font-weight:600;font-size:14.5px;color:var(--gold);overflow-wrap:anywhere}
.rub .w{font-size:14.5px}
@media (max-width:420px){.rub .row{grid-template-columns:36px 1fr}.rub .w{grid-column:2}}
.k-when .series{color:var(--gold);font-weight:600}
.weeks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.wk{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;display:grid;gap:4px}
.wk-d{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk-t{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-weight:600;line-height:1.15}
.wk p{margin:0;font-size:15px}

html,body{margin:0}
.back{display:inline-flex;align-items:center;gap:6px;margin-top:20px;font-size:14px;font-weight:600;color:var(--gold);text-decoration:none}
.back:hover{text-decoration:underline}


.lock-form{margin-top:24px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:grid;grid-template-columns:minmax(0,1fr);gap:10px;max-width:420px}
.lock-label{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.lock-row{display:flex;gap:8px}
.lock-row input{flex:1;min-width:0;width:100%;font:500 18px/1.2 "Manrope",system-ui,sans-serif;letter-spacing:.2em;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.lock-row input:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.lock-row button{flex:0 0 auto;border:0;border-radius:10px;background:var(--gold);color:var(--bg);font:600 15px/1 "Manrope",system-ui,sans-serif;padding:0 18px;cursor:pointer}
.lock-row button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.lock-row button:disabled{opacity:.7;cursor:progress}
.lock-err{margin:0;font-size:14px;color:var(--cta)}
.lock-wait .lock-form{visibility:hidden}
</style>
</head>
<body>
<div class="wrap" id="lock">
  <div class="top">
    <div class="eyebrow">ВРЕМЯ ПРОБУЖДЕНИЯ с ИРИНОЙ</div>
    <h1>Закрытая страница</h1>
    <p class="lead">Здесь контент-планы канала. Введи пароль, чтобы открыть.</p>
  </div>
  <form class="lock-form" id="lock-form">
    <label class="lock-label" for="lock-pass">Пароль</label>
    <div class="lock-row">
      <input id="lock-pass" type="password" inputmode="numeric" autocomplete="current-password" required>
      <button type="submit" id="lock-btn">Открыть</button>
    </div>
    <p class="lock-err" id="lock-err" role="alert" hidden>Пароль не подошёл. Попробуй ещё раз.</p>
  </form>
  <noscript><p class="lead">Чтобы открыть страницу, включи JavaScript в браузере.</p></noscript>
</div>

<script>
(function(){
  var KEY='ira-posty-pass';
  var D=JSON.parse(document.getElementById('lock-data').textContent);
  var form=document.getElementById('lock-form'),input=document.getElementById('lock-pass'),
      btn=document.getElementById('lock-btn'),err=document.getElementById('lock-err');
  function bytes(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function save(v){try{if(v)localStorage.setItem(KEY,v);else localStorage.removeItem(KEY);}catch(e){}}
  function saved(){try{return localStorage.getItem(KEY);}catch(e){return null;}}
  function unlock(p){
    return crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey'])
      .then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(D.s),iterations:D.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);})
      .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(D.i)},k,bytes(D.c));})
      .then(function(b){return JSON.parse(new TextDecoder().decode(b));});
  }
  function show(page){
    document.documentElement.classList.remove('lock-wait');
    document.body.innerHTML=page.h;
    page.s.forEach(function(code){var e=document.createElement('script');e.textContent=code;document.body.appendChild(e);});
    if(location.hash){var t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)t.scrollIntoView();}
  }
  if(!(window.crypto&&crypto.subtle&&window.TextEncoder)){
    err.textContent='Этот браузер не может открыть страницу. Открой её в Safari или Chrome.';err.hidden=false;return;
  }
  var p0=saved();
  if(p0){
    document.documentElement.classList.add('lock-wait');
    unlock(p0).then(show,function(){save('');document.documentElement.classList.remove('lock-wait');});
  }
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var v=input.value.trim();if(!v)return;
    btn.disabled=true;btn.textContent='Открываю…';err.hidden=true;
    unlock(v).then(function(page){save(v);show(page);},function(){
      btn.disabled=false;btn.textContent='Открыть';err.hidden=false;input.select();
    });
  });
})();
</script>
