<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-balance-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../favicon-balance-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon-balance.png">
<title>Обида: промт и сценарий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#FAF6EE;--surface:#FFFDF8;--ink:#2B2620;--muted:#7A6F60;--line:#E7DDCB;--gold:#A8823A;--code:#F3E9D3;--cta:#8A5A2B;--focus:#A8823A;--btn:#7A1F2B;--btnfg:#fff;
--serif:"Cormorant Garamond",Georgia,serif;--sans:"Manrope",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1C1915;--surface:#25211B;--ink:#EFE7D8;--muted:#A99C87;--line:#3A342A;--gold:#D4B06A;--code:#2A241A;--cta:#E7B98A;--focus:#D4B06A;--btn:#D4B06A;--btnfg:#1a1508}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1C1915;--surface:#25211B;--ink:#EFE7D8;--muted:#A99C87;--line:#3A342A;--gold:#D4B06A;--code:#2A241A;--cta:#E7B98A;--focus:#D4B06A;--btn:#D4B06A;--btnfg:#1a1508}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;padding-block:16px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-user-select:text;user-select:text}
.wrap{max-width:720px;margin:0 auto;min-width:0}
.eyebrow{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.lead{color:var(--muted)}
h1,h2,h3{font-family:var(--serif);line-height:1.15;text-wrap:balance}
h1{font-size:2rem;margin:.4em 0 .3em}h2{font-size:1.5rem;margin:1.6em 0 .5em;color:var(--gold)}h3{font-size:1.2rem;margin:1.4em 0 .5em}
p,li{overflow-wrap:anywhere}p{margin:.7em 0}ul{padding-left:1.2em}
hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.code{border:1px solid var(--line);background:var(--code);border-radius:8px;margin:1em 0;min-width:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
pre{margin:0;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:.95rem;user-select:text;-webkit-user-select:text}
button.cp{font:600 .9rem var(--sans);background:var(--btn);color:var(--btnfg);border:0;border-radius:6px;padding:9px 14px;min-height:40px;cursor:pointer}
button.cp:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.all{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;border-bottom:1px solid var(--line)}
.pbtn{display:flex;flex-wrap:wrap;gap:8px;padding:12px}button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.tw{overflow-x:auto;margin:1em 0}table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{background:var(--code)}

.lock-form{margin-top:24px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:grid;grid-template-columns:minmax(0,1fr);gap:10px;max-width:420px}
.lock-label{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.lock-row{display:flex;gap:8px}
.lock-row input{flex:1;min-width:0;width:100%;font:500 18px/1.2 "Manrope",system-ui,sans-serif;letter-spacing:.2em;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.lock-row input:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.lock-row button{flex:0 0 auto;border:0;border-radius:10px;background:var(--gold);color:var(--bg);font:600 15px/1 "Manrope",system-ui,sans-serif;padding:0 18px;cursor:pointer}
.lock-row button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.lock-row button:disabled{opacity:.7;cursor:progress}
.lock-err{margin:0;font-size:14px;color:var(--cta)}
.lock-wait .lock-form{visibility:hidden}
</style>
</head>
<body>
<div class="wrap" id="lock">
  <div class="top">
    <div class="eyebrow">ВРЕМЯ ПРОБУЖДЕНИЯ с ИРИНОЙ</div>
    <h1>Закрытая страница</h1>
    <p class="lead">Здесь промт и сценарий карусели про Обиду. Введи пароль, чтобы открыть.</p>
  </div>
  <form class="lock-form" id="lock-form">
    <label class="lock-label" for="lock-pass">Пароль</label>
    <div class="lock-row">
      <input id="lock-pass" type="password" inputmode="numeric" autocomplete="current-password" required>
      <button type="submit" id="lock-btn">Открыть</button>
    </div>
    <p class="lock-err" id="lock-err" role="alert" hidden>Пароль не подошёл. Попробуй ещё раз.</p>
  </form>
  <noscript><p class="lead">Чтобы открыть страницу, включи JavaScript в браузере.</p></noscript>
</div>

<script>
(function(){
  var KEY='ira-posty-pass';
  var D=JSON.parse(document.getElementById('lock-data').textContent);
  var form=document.getElementById('lock-form'),input=document.getElementById('lock-pass'),
      btn=document.getElementById('lock-btn'),err=document.getElementById('lock-err');
  function bytes(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function save(v){try{if(v)localStorage.setItem(KEY,v);else localStorage.removeItem(KEY);}catch(e){}}
  function saved(){try{return localStorage.getItem(KEY);}catch(e){return null;}}
  function unlock(p){
    if(!(window.crypto&&crypto.subtle))return unlockForge(p);
    return crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey'])
      .then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(D.s),iterations:D.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);})
      .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(D.i)},k,bytes(D.c));})
      .then(function(b){return JSON.parse(new TextDecoder().decode(b));});
  }
  // На адресе без https браузер не даёт crypto.subtle: расшифровываем библиотекой forge.
  var forgeP=null;
  function loadForge(){
    if(window.forge)return Promise.resolve(window.forge);
    if(!forgeP)forgeP=new Promise(function(ok,no){var s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/forge/1.3.1/forge.min.js';
      s.onload=function(){ok(window.forge);};s.onerror=function(){forgeP=null;no(new Error('forge'));};document.head.appendChild(s);});
    return forgeP;
  }
  function unlockForge(p){
    return loadForge().then(function(f){return new Promise(function(ok){setTimeout(ok,30);}).then(function(){
      var key=f.pkcs5.pbkdf2(f.util.encodeUtf8(p),atob(D.s),D.n,32,f.md.sha256.create());
      var c=atob(D.c),tag=c.slice(-16),d=f.cipher.createDecipher('AES-GCM',key);
      d.start({iv:atob(D.i),tagLength:128,tag:f.util.createBuffer(tag)});
      d.update(f.util.createBuffer(c.slice(0,-16)));
      if(!d.finish())throw new Error('pass');
      return JSON.parse(f.util.decodeUtf8(d.output.getBytes()));
    });});
  }
  function show(page){
    document.documentElement.classList.remove('lock-wait');
    document.body.innerHTML=page.h;
    page.s.forEach(function(code){var e=document.createElement('script');e.textContent=code;document.body.appendChild(e);});
    if(location.hash){var t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)t.scrollIntoView();}
  }
  if(!(window.Promise&&window.TextEncoder&&window.JSON)){
    err.textContent='Этот браузер не может открыть страницу. Открой её в Safari или Chrome.';err.hidden=false;return;
  }
  var p0=saved();
  if(p0){
    document.documentElement.classList.add('lock-wait');
    unlock(p0).then(show,function(){save('');document.documentElement.classList.remove('lock-wait');});
  }
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var v=input.value.trim();if(!v)return;
    btn.disabled=true;btn.textContent='Открываю…';err.hidden=true;
    unlock(v).then(function(page){save(v);show(page);},function(){
      btn.disabled=false;btn.textContent='Открыть';err.hidden=false;input.select();
    });
  });
})();
</script>
