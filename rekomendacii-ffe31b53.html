<html lang="ru">
<head>

<link rel="icon" type="image/png" sizes="32x32" href="favicon-balance-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-balance-48.png">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-balance-96.png">

<title>Рекомендации для Ирины</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FAF6EE;
  --surface:#FFFDF8;
  --ink:#2B2620;
  --muted:#7A6F60;
  --line:#E7DDCB;
  --gold:#A8823A;
  --gold-soft:#F3E9D3;
  --todo-bg:#FBF3E1;
  --todo-line:#E4CF9F;
  --cta:#8A5A2B;
  --cta-bg:#F4E4D2;
  --focus:#A8823A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1C1915;--surface:#25211B;--ink:#EFE7D8;--muted:#A99C87;--line:#3A342A;
    --gold:#D4B06A;--gold-soft:#3A3122;--todo-bg:#2E2718;--todo-line:#5A4A2A;
    --cta:#E7B98A;--cta-bg:#3D2E20;--focus:#D4B06A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1C1915;--surface:#25211B;--ink:#EFE7D8;--muted:#A99C87;--line:#3A342A;
  --gold:#D4B06A;--gold-soft:#3A3122;--todo-bg:#2E2718;--todo-line:#5A4A2A;
  --cta:#E7B98A;--cta-bg:#3D2E20;--focus:#D4B06A;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:680px;margin:0 auto}
.top{padding-block:32px 8px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
.range{color:var(--muted);font-size:14px;margin-top:4px;font-variant-numeric:tabular-nums}
h1{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:600;font-size:clamp(34px,8vw,46px);line-height:1.05;margin:.3em 0 .25em;text-wrap:balance}
.lead{color:var(--muted);margin:0;max-width:60ch}
.chip:focus-visible,.copy:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.post-text{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px 16px 12px;font-size:15.5px}
.post-text a{color:var(--gold)}
.copy{display:block;width:100%;border:0;border-top:1px solid var(--line);background:var(--gold-soft);color:var(--ink);font:600 15px/1 "Manrope",system-ui,sans-serif;padding:14px;cursor:pointer}
.copy:hover{filter:brightness(.97)}
.copy.done{background:var(--gold);color:var(--bg)}
.foot{color:var(--muted);font-size:13px;padding-top:20px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
.plans{list-style:none;margin:24px 0 8px;padding:0;display:grid;gap:12px}
.plan a{display:grid;gap:6px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);text-decoration:none}
.plan a:hover{border-color:var(--todo-line)}
.plan a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.plan-d,.rec-d{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.plan-t{font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;font-weight:600;line-height:1.1;text-wrap:balance}
.plan-p{margin:0;font-size:15px;color:var(--muted)}
.plan-go{font-size:14px;font-weight:600;color:var(--gold)}
.rec{padding-block:32px 16px;border-top:1px solid var(--line);margin-top:24px;display:grid;gap:12px;scroll-margin-top:12px}
.rec h2{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-size:clamp(28px,7vw,36px);font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
.rec h3{margin:16px 0 0;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.rec h4{margin:18px 0 -4px;font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-size:23px;font-weight:600;line-height:1.15;text-wrap:balance}
.rec p{margin:0;max-width:62ch}
.rec ul,.rec ol{margin:0;padding-left:20px;display:grid;gap:6px}
.rec a{color:var(--gold);overflow-wrap:anywhere}
.rec .post-text a{color:var(--gold)}
.up{justify-self:start;font-size:14px;font-weight:600;text-decoration:none;margin-top:8px}
.up:hover{text-decoration:underline}

.rec blockquote{margin:6px 0;padding:12px 16px;background:var(--gold-soft);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;max-width:62ch}
.rec .practice{display:grid;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.group{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-size:clamp(26px,6.5vw,32px);font-weight:600;line-height:1.1;margin:36px 0 0;text-wrap:balance}
.group-note{margin:6px 0 0;font-size:14px;color:var(--muted)}
.rec .tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.rec table{border-collapse:collapse;width:100%;min-width:440px;font-size:13px}
.rec th,.rec td{padding:8px 7px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.rec th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700}
.rec tr:last-child td{border-bottom:0}


.lock-form{margin-top:24px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:grid;grid-template-columns:minmax(0,1fr);gap:10px;max-width:420px}
.lock-label{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.lock-row{display:flex;gap:8px}
.lock-row input{flex:1;min-width:0;width:100%;font:500 18px/1.2 "Manrope",system-ui,sans-serif;letter-spacing:.2em;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.lock-row input:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.lock-row button{flex:0 0 auto;border:0;border-radius:10px;background:var(--gold);color:var(--bg);font:600 15px/1 "Manrope",system-ui,sans-serif;padding:0 18px;cursor:pointer}
.lock-row button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.lock-row button:disabled{opacity:.7;cursor:progress}
.lock-err{margin:0;font-size:14px;color:var(--cta)}
.lock-wait .lock-form{visibility:hidden}
</style>
</head>
<body>
<div class="wrap" id="lock">
  <div class="top">
    <div class="eyebrow">Для Ирины</div>
    <h1>Закрытая страница</h1>
    <p class="lead">Здесь рекомендации Клода по продвижению. Введи пароль, чтобы открыть.</p>
  </div>
  <form class="lock-form" id="lock-form">
    <label class="lock-label" for="lock-pass">Пароль</label>
    <div class="lock-row">
      <input id="lock-pass" type="password" inputmode="numeric" autocomplete="current-password" required>
      <button type="submit" id="lock-btn">Открыть</button>
    </div>
    <p class="lock-err" id="lock-err" role="alert" hidden>Пароль не подошёл. Попробуй ещё раз.</p>
  </form>
  <noscript><p class="lead">Чтобы открыть страницу, включи JavaScript в браузере.</p></noscript>
</div>

<script>
(function(){
  var KEY='ira-posty-pass';
  var D=JSON.parse(document.getElementById('lock-data').textContent);
  var form=document.getElementById('lock-form'),input=document.getElementById('lock-pass'),
      btn=document.getElementById('lock-btn'),err=document.getElementById('lock-err');
  function bytes(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function save(v){try{if(v)localStorage.setItem(KEY,v);else localStorage.removeItem(KEY);}catch(e){}}
  function saved(){try{return localStorage.getItem(KEY);}catch(e){return null;}}
  function unlock(p){
    if(!(window.crypto&&crypto.subtle))return unlockForge(p);
    return crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey'])
      .then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(D.s),iterations:D.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);})
      .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(D.i)},k,bytes(D.c));})
      .then(function(b){return JSON.parse(new TextDecoder().decode(b));});
  }
  // На адресе без https браузер не даёт crypto.subtle: расшифровываем библиотекой forge.
  var forgeP=null;
  function loadForge(){
    if(window.forge)return Promise.resolve(window.forge);
    if(!forgeP)forgeP=new Promise(function(ok,no){var s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/forge/1.3.1/forge.min.js';
      s.onload=function(){ok(window.forge);};s.onerror=function(){forgeP=null;no(new Error('forge'));};document.head.appendChild(s);});
    return forgeP;
  }
  function unlockForge(p){
    return loadForge().then(function(f){return new Promise(function(ok){setTimeout(ok,30);}).then(function(){
      var key=f.pkcs5.pbkdf2(f.util.encodeUtf8(p),atob(D.s),D.n,32,f.md.sha256.create());
      var c=atob(D.c),tag=c.slice(-16),d=f.cipher.createDecipher('AES-GCM',key);
      d.start({iv:atob(D.i),tagLength:128,tag:f.util.createBuffer(tag)});
      d.update(f.util.createBuffer(c.slice(0,-16)));
      if(!d.finish())throw new Error('pass');
      return JSON.parse(f.util.decodeUtf8(d.output.getBytes()));
    });});
  }
  function show(page){
    document.documentElement.classList.remove('lock-wait');
    document.body.innerHTML=page.h;
    page.s.forEach(function(code){var e=document.createElement('script');e.textContent=code;document.body.appendChild(e);});
    if(location.hash){var t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)t.scrollIntoView();}
  }
  if(!(window.Promise&&window.TextEncoder&&window.JSON)){
    err.textContent='Этот браузер не может открыть страницу. Открой её в Safari или Chrome.';err.hidden=false;return;
  }
  var p0=saved();
  if(p0){
    document.documentElement.classList.add('lock-wait');
    unlock(p0).then(show,function(){save('');document.documentElement.classList.remove('lock-wait');});
  }
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var v=input.value.trim();if(!v)return;
    btn.disabled=true;btn.textContent='Открываю…';err.hidden=true;
    unlock(v).then(function(page){save(v);show(page);},function(){
      btn.disabled=false;btn.textContent='Открыть';err.hidden=false;input.select();
    });
  });
})();
</script>
</body>
</html>
